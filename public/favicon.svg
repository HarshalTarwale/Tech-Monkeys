<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Circle background -->
  <circle cx="100" cy="100" r="95" fill="#000000"/>

  <!-- "T" letter, built as exact shapes (not a font glyph) so the whole
       "T." group can be centered precisely rather than eyeballed -->
  <rect x="59.5" y="64" width="62" height="18" fill="white"/>
  <rect x="81.5" y="64" width="18" height="72" fill="white"/>

  <!-- Dot: 5px gap from the T's right edge, baseline-aligned -->
  <circle cx="133.5" cy="129" r="7" fill="#3D5AFE"/>
</svg>
